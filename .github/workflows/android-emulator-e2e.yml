name: Omega VPN Android 15 E2E emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/emulator-e2e.py'
      - 'scripts/build-xray-android.sh'
      - 'probe/**'
      - 'settings.gradle.kts'
      - '.github/workflows/android-emulator-e2e.yml'

permissions:
  contents: read

concurrency:
  group: omega-emulator-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpn-on-real-android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android CLI tools
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/omega-android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl -fsSL --retry 3 --max-time 180 \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-cli"
          cp -a "$RUNNER_TEMP/android-cli/cmdline-tools/." "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install pinned Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.0.13004108"'
      - name: Compile Xray JNI for x86_64 Android (not Linux proxy)
        env:
          OMEGA_ANDROID_TARGETS: android/amd64
        run: |
          bash scripts/build-xray-android.sh
          unzip -l app/libs/libv2ray.aar | grep 'jni/x86_64/libgojni.so'
      - name: Build Ω VPN and separate UID probe APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :probe:assembleDebug
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 device-level TUN, HTTPS, DNS and egress IP test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 scripts/emulator-e2e.py
      - name: Upload anonymized emulator evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-android-emulator-evidence
          path: e2e-results/
          retention-days: 7
          if-no-files-found: warn
